name: CI

on:
  push:
    # Tags are covered by the release workflow, which calls this one.
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      # Report both platforms even when one fails.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke tests
        run: ./tests/smoke.sh
