name: Release

# Push a tag such as v0.1.0 to publish. The tag must match AIBOX_VERSION in ai-box and
# CHANGELOG.md must have a "## [0.1.0]" section, which becomes the release notes.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  smoke:
    uses: ./.github/workflows/ci.yml

  release:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches AIBOX_VERSION
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^AIBOX_VERSION="\(.*\)"$/\1/p' ai-box)"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match AIBOX_VERSION=\"$declared\" in ai-box"
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # 截取该版本的章节,去掉首尾空行
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && !started && /^[[:space:]]*$/ { next }
            found { started = 1; lines[++n] = $0 }
            END { while (n > 0 && lines[n] ~ /^[[:space:]]*$/) n--; for (i = 1; i <= n; i++) print lines[i] }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag $prerelease \
            --title "aibox $GITHUB_REF_NAME" --notes-file release-notes.md

  homebrew:
    # Point the tap's formula at the new release. Needs a HOMEBREW_TAP_TOKEN secret that can
    # push to <owner>/homebrew-tap; without it the release still succeeds and this step skips.
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ github.repository_owner }}/homebrew-tap
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          sha="$(curl -fsSL --retry 3 "$url" | sha256sum | cut -d' ' -f1)"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          cd tap
          sed -i -E \
            -e "s|^  url \".*\"|  url \"${url}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${sha}\"|" \
            Formula/aibox.rb
          if git diff --quiet; then
            echo "The formula already points at ${GITHUB_REF_NAME}."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -am "aibox ${version}"
          git push
